services:
  mongo:
    image: mongo:7
    container_name: url_shortener_mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=url_shortener
    volumes:
      - mongo-data:/data/db
    networks:
      - url_shortener_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url_shortener_backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/url-shortener
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET before running docker compose}
      - ANALYTICS_IP_SALT=${ANALYTICS_IP_SALT:-}
      - JWT_EXPIRES_IN=7d
      - COOKIE_NAME=token
      - CSRF_COOKIE_NAME=csrfToken
      - CLIENT_URL=http://localhost:3001
      - BASE_URL=http://localhost:3001
      - BLOCKED_REDIRECT_HOSTS=${BLOCKED_REDIRECT_HOSTS:-}
      - ALLOWED_REDIRECT_HOSTS=${ALLOWED_REDIRECT_HOSTS:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - AUTH_RATE_LIMIT_MAX=10
      - ANALYTICS_RETENTION_DAYS=90
      - ANALYTICS_QUEUE_MAX_SIZE=5000
      - ANALYTICS_FLUSH_INTERVAL_MS=5000
      - ANALYTICS_BATCH_SIZE=100
      - SHORT_CODE_LENGTH=7
      - TRUST_PROXY=true
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - url_shortener_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_PUBLIC_BASE_URL: http://localhost:3001
    container_name: url_shortener_frontend
    restart: unless-stopped
    ports:
      - "3001:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - url_shortener_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:

networks:
  url_shortener_net:
    driver: bridge
